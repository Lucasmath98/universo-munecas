<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Universo de Muñecas</title>
<meta name="theme-color" content="#008069">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<!-- UTMify pixel -->

<script src="https://cdn.utmify.com.br/scripts/pixel/pixel.js" async defer></script>

<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','966368535823595');fbq('track','PageView');
</script>
<style>
:root{--head:#008069;--bg:#efeae2;--me:#d9fdd3;--them:#fff;--txt:#111b21;--muted:#667781;--blue:#027eb5;--green:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#d1d7db;color:var(--txt)}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.app:before{content:"";position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:radial-gradient(#000 1px,transparent 1px);background-size:18px 18px}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:2}
header .av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
header b{display:block;font-size:16px}
header small{font-size:12.5px;opacity:.85}
#chat{flex:1;overflow-y:auto;padding:12px 10px 8px;position:relative;z-index:1}
.day{text-align:center;margin:4px auto 10px;background:#fff;color:var(--muted);font-size:12px;padding:5px 10px;border-radius:8px;width:max-content;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.row{display:flex;margin:2px 0}
.row.me{justify-content:flex-end}
.b{max-width:82%;background:var(--them);border-radius:8px;padding:6px 8px 4px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.row.me .b{background:var(--me)}
.row.first:not(.me) .b{border-top-left-radius:0}
.row.me.first .b{border-top-right-radius:0}
.t{float:right;font-size:11px;color:var(--muted);margin:6px 0 -2px 10px}
.row.me .t:after{content:" ✓✓";color:#53bdeb}
.b img{display:block;width:100%;max-width:300px;border-radius:6px;margin-bottom:4px}
.b img.st{width:140px;background:none}
.row.stk .b{background:none;box-shadow:none;padding:0}
.b audio{width:250px;max-width:100%;height:40px;display:block}
.doc{display:flex;align-items:center;gap:10px;background:#f5f6f6;border-radius:6px;padding:10px;text-decoration:none;color:var(--txt);min-width:230px;margin-bottom:2px;white-space:normal}
.doc .ic{width:34px;height:40px;background:#e53935;color:#fff;border-radius:3px;font-size:10px;font-weight:700;display:grid;place-items:end center;padding-bottom:4px;flex:none}
.doc b{font-size:14px;font-weight:500;display:block}
.doc small{font-size:12px;color:var(--muted)}
.doc .dl{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;color:var(--muted);font-size:15px;flex:none}
.doc.ok .dl{border-color:var(--green);color:var(--green)}
.cta{display:block;margin:8px -8px 0;border-top:1px solid #e9edef;padding:11px;text-align:center;color:var(--blue);font-weight:600;text-decoration:none;font-size:15px;white-space:normal}
.typing .b{padding:10px 14px}
.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#8696a0;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
#opts{position:relative;z-index:2;padding:6px 8px 2px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#opts:empty{display:none}
.bar{position:relative;z-index:2;display:flex;gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:#f0f2f5}
.bar input{flex:1;border:0;border-radius:22px;padding:12px 16px;font-size:16px;outline:none;background:#fff}
.bar button{width:46px;height:46px;border-radius:50%;border:0;background:var(--head);color:#fff;font-size:18px;flex:none;cursor:pointer}
.oxxo img{background:#fff;padding:6px;border-radius:6px}
.qr{background:#fff;border:0;border-radius:20px;padding:12px 18px;font-size:15px;font-weight:600;color:var(--head);box-shadow:0 1px 2px rgba(0,0,0,.2);cursor:pointer}
.qr.main{background:var(--green);color:#fff}
.payf{margin:8px -4px 2px;border-radius:8px;overflow:hidden;background:#fff;border:1px solid #e9edef}
.payf iframe{display:block;width:100%;height:640px;border:0}
.row:has(.payf) .b{max-width:96%;width:96%}
.hint{color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="av" src="avatar.jpg" alt="María Fernanda">
    <div><b>María Fernanda García</b><small id="status">en línea</small></div>
  </header>
  <div id="chat"><div class="day">HOY</div></div>
  <div id="opts"><span class="hint">Cargando…</span></div>
  <form class="bar" id="bar" onsubmit="onSend(event)"><input id="inp" placeholder="Mensaje" autocomplete="off" enterkeyhint="send"><button id="send" aria-label="Enviar">➤</button></form>
</div>

<script>
// ===== CONFIG =====
// Links XPag por monto
const PAY_LINKS={100:'https://xpag.global/pay/6434HTwf',150:'https://xpag.global/pay/5A3ngMbV',200:'https://xpag.global/pay/bemI94to',250:'https://xpag.global/pay/8Qy2DuT2'};
// Upsell actividades (cambiar cuando exista su link propio)
const UPSELL_NODES_FROM=5267213, UPSELL_LINK='https://xpag.global/pay/6434HTwf';
// URL del servidor (Cloudflare Worker). Vacío = modo sin servidor
const API='https://universo-munecas.nocaminhocerto20.workers.dev';
const SPEED=/fast=1/.test(location.search)?0.01:1;

// ===== estado =====
const KEY='umflow3';
if(/reset=1/.test(location.search)){try{localStorage.removeItem(KEY)}catch(e){}}
const st=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const qs=new URLSearchParams(location.search);
if(!st.sid){st.sid=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
if(!st.hist)st.hist=[];
if(!st.utm){st.utm={};for(const [k,v] of qs)if(/^(utm_|fbclid|src|sck|xcod)/.test(k))st.utm[k]=v;save()}
const withUtm=l=>{const u=new URL(l);for(const [a,b] of Object.entries(st.utm||{}))u.searchParams.set(a,b);return u.toString()};

const chat=document.getElementById('chat'),opts=document.getElementById('opts'),status=document.getElementById('status');
const now=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
let last=null,shown=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const down=()=>{chat.scrollTop=chat.scrollHeight};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'\n<a href="$1" target="_blank" rel="noopener" style="color:#027eb5;word-break:break-all">$1</a>\n').replace(/\n{3,}/g,'\n\n').replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g,'$1<i>$2</i>').replace(/~([^~\n]+)~/g,'<s>$1</s>');
const clean=s=>String(s).replace(/Sofía Hernández/g,'María Fernanda García').replace(/Sofía/g,'María Fernanda').replace(/\{(first_name|full_name|name|nome|primeiro_nome)\}/gi,'').replace(/ +([,!?.])/g,'$1').replace(/[ \t]{2,}/g,' ');
function persist(){st.html=chat.innerHTML;save()}
function add(html,who='them',cls=''){shown=1;const r=document.createElement('div');r.className='row '+(who==='me'?'me ':'')+(last!==who?'first ':'')+cls;last=who;r.innerHTML=`<div class="b">${html}<span class="t">${now()}</span></div>`;chat.appendChild(r);down();try{const t=r.querySelector('.b').innerText.replace(/\s*\d{1,2}:\d{2}.*$/,'').trim();if(t){st.hist.push({me:who==='me',t:t.slice(0,600)});st.hist=st.hist.slice(-20)}}catch(e){}persist();return r}
async function typing(ms,rec){status.textContent=rec?'grabando audio...':'escribiendo...';const r=document.createElement('div');r.className='row typing';r.innerHTML='<div class="b"><i></i><i></i><i></i></div>';chat.appendChild(r);down();await sleep(ms);r.remove();status.textContent='en línea'}
function mark(el){el.classList.add('ok');el.querySelector('.dl').textContent='✓';persist()}
function payClick(v){fbq('track','InitiateCheckout',{value:v,currency:'MXN'});st.payClicked=1;save()}
let pending=null;
function ask(list,ai){opts.innerHTML='';return new Promise(res=>{pending={list,ai,res:v=>{pending=null;opts.innerHTML='';res(v)}};for(const [label,val,main] of list){const b=document.createElement('button');b.className='qr'+(main?' main':'');b.textContent=label;b.onclick=()=>{add(esc(label),'me');pending&&pending.res(val)};opts.appendChild(b)}})}
async function api(path,body){if(!API)return null;try{const r=await fetch(API+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});return await r.json()}catch(e){return null}}
const lastThem=()=>{const h=st.hist.filter(x=>!x.me);return h.length?h[h.length-1].t:''};
let busy=false;
async function onSend(e){e.preventDefault();const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;inp.value='';add(fmt(text),'me');
  while(busy)await new Promise(r=>setTimeout(r,300));
  const p=pending;
  if(p&&!p.ai){p.res(p.list[0][1]);return}
  busy=true;
  try{
    const r=await api('/chat',{sid:st.sid,text,history:st.hist.slice(0,-1),options:p&&p.ai?p.ai.options:[],context:'Tu nombre es María Fernanda García (no Sofía). '+((p&&p.ai&&p.ai.context)||lastThem())});
    if(!r){ if(p&&p.ai&&p.ai.options.length){p.res(p.ai.map.positivo);return} await typing(1500);add('¡Gracias, corazón! 💕');return }
    if(p&&p.ai&&p.ai.map&&p.ai.map[r.intent]!==undefined&&pending===p){p.res(p.ai.map[r.intent]);return}
    if(r.reply){await sleep(800);await typing(Math.max(1500,Math.min(6000,r.reply.length*40)));add(fmt(r.reply))}
  }finally{busy=false}
}
const fmtSize=b=>b?(b>1e6?Math.round(b/1e6)+' MB':Math.round(b/1e3)+' kB'):'';

// ===== motor del funil =====
let F,N;
const CLABE='734180009421954294';
function copyClabe(el){try{navigator.clipboard.writeText(st.clabe||CLABE)}catch(e){}el.textContent='✅ CLABE copiada'}
function oxxo(el,u){const d=document.createElement('div');d.className='payf';d.innerHTML='<iframe src="'+u+'"></iframe>';el.replaceWith(d);el.closest&&0;setTimeout(()=>d.scrollIntoView({behavior:'smooth'}),100);persist()}
const SKIP=new Set(['start','tags','pixel','approved_sale','notification','manipulator','chat_controller','integration','connection_flow']);
const conn=(n,label)=>(n.c.find(c=>c[1]===label)||[])[0];
const first=n=>(n.c.find(c=>c[1]!=='timeout'&&c[1]!=='error'&&c[1]!=='failure')||n.c[0]||[])[0];

async function runActions(n){
  for(const a of n.a){
    switch(a.k){
      case 'd': if(!shown)break; await sleep(Math.min(a.s||2,8)*1000); break;
      case 'msg': { if(/\{[a-z_.]+\}/i.test(clean(a.t)))break; const t=clean(a.t).trim(); if(!t)break; if(shown)await sleep(700+Math.random()*900); await typing(!shown?1500:a.td?Math.min(a.td,12)*1000:Math.max(1800,Math.min(7000,t.length*45))); add(fmt(t)); if(!st.welcome){st.welcome=1;save();await sleep(1200);await typing(2500);add('<img src="welcome.jpg" alt="Universo de Muñecas">')} break; }
      case 'image': await sleep(1200); await typing(2500); add(`<img src="${a.u}" alt="" loading="lazy">${a.cap?fmt(clean(a.cap)):''}`); break;
      case 'video': await typing(1200); add(`<video src="${a.u}" controls playsinline style="width:100%;max-width:300px;border-radius:6px"></video>`); break;
      case 'audio': await sleep(900); await typing(6000+Math.random()*3000,true); add(`<audio src="${a.u}" controls preload="none"></audio>`); break;
      case 'sticker': await sleep(600); add(`<img class="st" src="${a.u}" alt="">`,'them','stk'); break;
      case 'file': await sleep(900+Math.random()*900); add(`<a class="doc" href="${a.u}" target="_blank" rel="noopener" onclick="mark(this)"><div class="ic">PDF</div><div><b>${esc(a.n)}</b><small>PDF ${fmtSize(a.sz)}</small></div><span class="dl">↓</span></a>`); break;
    }
  }
}
function payButtons(n,id){
  const p=n.a.find(a=>a.k==='pay');const amt=+p.amt;
  if(id>=UPSELL_NODES_FROM) return [[amt,UPSELL_LINK]];
  if(p.open) return [100,150,200,250].map(v=>[v,PAY_LINKS[v]]);
  return [[amt,PAY_LINKS[amt]||PAY_LINKS[100]]];
}
async function step(id){
  const n=N[id]; if(!n) return null;
  st.node=id; save();
  if(SKIP.has(n.t)) return first(n);
  if(n.t==='distributor'){const outs=n.c.map(c=>c[0]);return outs[Math.floor(Math.random()*outs.length)]}
  if(n.t==='message'){await runActions(n);return first(n)}
  if(n.t==='wait_response'){
    const nxt=conn(n,'client-response'); if(!nxt) return null;
    if(N[nxt]&&N[nxt].t==='ai') return nxt;
    await ask([['Sí 💕',1,1]]); return nxt;
  }
  if(n.t==='ai'){
    const pos=conn(n,'positivo'),neg=conn(n,'negativo'),comp=conn(n,'comprovante');
    if(pos||neg){
      const r=await ask([['¡Sí, claro! 💕','p',1],...(neg?[['No, gracias','n']]:[])],{options:neg?['positivo','negativo','duvida']:['positivo','duvida'],map:neg?{positivo:'p',negativo:'n'}:{positivo:'p'},context:lastThem()});
      if(r==='p'&&!st.lead){st.lead=1;save();fbq('track','Lead')}
      return r==='p'?pos:neg;
    }
    if(comp){await ask([['Ya hice mi pago ✅',1,1]]);return comp}
    return null;
  }
  if(n.t==='payment'){
    // segunda cobranza encadenada (SPEI→OXXO): se une a la anterior
    if(st.lastPay&&st.lastPayChain){st.lastPayChain=0;save();return conn(n,'charge_created')}
    const btns=payButtons(n,id); st.pay=st.pay||{};
    const stage='p'+id;
    let pd=st.pay[id];
    if(!pd){
      await sleep(900); await typing(2500);
      if(btns.length>1){
        add('Puedes elegir el valor de tu cooperación 👇');
        const v=await ask(btns.map(([v],i)=>['$'+v+' MXN',v,i===0]));
        btns.splice(0,btns.length,btns.find(b=>b[0]===v));
      }
      const [v,l]=btns[0];
      await sleep(600); await typing(2500);
      const d=await api('/charge',{sid:st.sid,stage,amount:v,utm:st.utm,desc:id>=UPSELL_NODES_FROM?'Kit de Actividades Creativas':'Universo de Muñecas'});
      const clabe=(d&&d.clabe)||CLABE;
      st.clabe=clabe;
      add(fmt('🏦 *CLABE* (18 dígitos):\n'+clabe+'\n*Banco*: '+((d&&d.clabe&&d.bank)||'FINCO PAY')+'\n*Beneficiario*: '+((d&&d.clabe&&d.beneficiary)||'Zypher Servicios')+'\n*Persona*: María Fernanda García'));
      await sleep(1500); await typing(1500);
      add(clabe+'<a class="cta" href="#" onclick="copyClabe(this);return false">📋 Copiar CLABE</a>');
      await sleep(1500); await typing(3000);
      if(d&&d.oxxo_ref){
        add('O, si lo prefieres, realiza tu pago mediante OXXO a continuación 👇🏻');
        await sleep(1200); await typing(2000);
        add('<div class="oxxo">'+(d.oxxo_barcode?'<img src="'+d.oxxo_barcode+'" alt="">':'')+'</div>'+fmt('🏪 *OXXO* · Referencia:\n'+d.oxxo_ref+'\nMonto exacto: *$'+v+' MXN*'));
      }else{
        add('O, si lo prefieres, realiza tu pago mediante OXXO a continuación 👇🏻<a class="cta" href="#" onclick="oxxo(this,\''+withUtm(l)+'\');return false">🏪 Pagar en OXXO</a>');
      }
      payClick(v);
      pd=st.pay[id]={v,api:!!(d&&(d.clabe||d.oxxo_ref)),rn:d&&d.oxxo_rn||''}; save();
    }
    if(pd.api){
      let stop=false;
      const paid=(async()=>{while(!stop){const r=await api('/status?sid='+st.sid+'&stage='+stage+'&rn='+encodeURIComponent(pd.rn||''));if(r&&r.paid)return r;await new Promise(r=>setTimeout(r,8000))}})();
      while(true){
        const r=await Promise.race([paid.then(x=>({paid:x})),ask([['Ya pagué ✅','ok',1]],{options:[],context:'La clienta está por pagar $'+pd.v+' MXN por SPEI u OXXO.'})]);
        if(r&&r.paid){stop=true;if(pending)pending.res(null);fbq('track','Purchase',{value:r.paid.amount||pd.v,currency:'MXN'});await typing(1800);add('✅ ¡Pago confirmado! Muchas gracias, corazón 💕');break}
        await sleep(600);await typing(2200);add('¡Gracias, corazón! 🙏 Estoy validando tu pago, en cuanto se confirme te aviso aquí mismo 💕');
      }
    }else{
      let r=await ask([['Ya pagué ✅','ok',1],['Pago más tarde','later']]);
      if(r==='later'){await typing(1200);add('¡Sin problema, corazón! 💜 Cuando hagas tu pago, regresa aquí y toca <b>"Ya pagué"</b>.');await ask([['Ya pagué ✅','ok',1]])}
    }
    st.lastPayChain=0;save();return conn(n,'payment_approved');
  }
  return first(n);
}
async function run(from){
  let id=from,guard=0;
  while(id&&guard++<300){id=await step(id)}
  st.end=1;save();
  opts.innerHTML='<span class="hint">📌 Tus archivos quedan guardados en esta conversación</span><button class="qr" onclick="restart()">🔄 Empezar de nuevo</button>';
}

(async()=>{
  F=await fetch('flow.json').then(r=>r.json());N=F.nodes;
  if(st.html&&st.node){
    chat.innerHTML=st.html;last=null;down();
    const n=N[st.node];
    if(st.end){opts.innerHTML='<span class="hint">📌 Tus archivos quedan guardados en esta conversación</span><button class="qr" onclick="restart()">🔄 Empezar de nuevo</button>';return}
    run(st.node); // retoma en la última pregunta
    return;
  }
  opts.innerHTML='';
  await sleep(600);
  run(F.start);
})();
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.href=location.pathname}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
